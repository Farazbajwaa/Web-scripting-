<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Welcome to the Book Finder</h1>
  </header>

  <section>
    <form id="bookForm">
      <label for="genre">Genre:</label>
      <select id="genre" name="genre">
        <option value="fiction">Fiction</option>
        <option value="non-fiction">Non-fiction</option>
        <option value="fantasy">Fantasy</option>
        <option value="mystery">Mystery</option>
      </select>

      <label for="author">Author:</label>
      <input type="text" id="author" name="author" placeholder="Enter author's name">

      <label for="priceRange">Price Range ($):</label>
      <input type="number" id="priceMin" name="priceMin" placeholder="Min price" min="0">
      <input type="number" id="priceMax" name="priceMax" placeholder="Max price" min="0">

      <label for="language">Language:</label>
      <select id="language" name="language">
        <option value="english">English</option>
        <option value="spanish">Spanish</option>
        <option value="french">French</option>
      </select>

      <button type="submit">Find Books</button>
    </form>
  </section>

  <section id="bookRecommendations">
    <h2>Book Recommendations</h2>
    <div id="recommendationList"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
